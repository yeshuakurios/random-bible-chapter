<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a3a"/>
      <stop offset="1" stop-color="#4a2c18"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e7d4"/>
      <stop offset="1" stop-color="#e4d3b6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="180" height="180" fill="url(#bg)"/>

  <!-- book -->
  <g>
    <!-- page edges -->
    <rect x="108" y="42" width="10" height="100" rx="2" fill="#d9c7a8"/>
    <!-- cover -->
    <rect x="42" y="34" width="76" height="112" rx="7" fill="url(#cover)"/>
    <!-- spine shadow -->
    <rect x="42" y="34" width="14" height="112" rx="7" fill="#c9714a" opacity="0.55"/>
    <!-- text lines -->
    <rect x="66" y="58" width="38" height="5" rx="2.5" fill="#a9835c"/>
    <rect x="66" y="72" width="38" height="5" rx="2.5" fill="#a9835c"/>
    <rect x="66" y="86" width="26" height="5" rx="2.5" fill="#a9835c"/>
    <!-- bookmark ribbon -->
    <path d="M84 34 H100 V78 L92 68 L84 78 Z" fill="#c1453a"/>
  </g>

  <!-- die (randomness) -->
  <g transform="rotate(10 132 132)">
    <rect x="100" y="100" width="58" height="58" rx="13" fill="#f6efe2" stroke="#4a2c18" stroke-width="3"/>
    <circle cx="115" cy="115" r="5.5" fill="#4a2c18"/>
    <circle cx="129" cy="129" r="5.5" fill="#4a2c18"/>
    <circle cx="143" cy="143" r="5.5" fill="#4a2c18"/>
    <circle cx="143" cy="115" r="5.5" fill="#4a2c18"/>
    <circle cx="115" cy="143" r="5.5" fill="#4a2c18"/>
  </g>
</svg>
